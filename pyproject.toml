[tool.poetry]
name = "coding-agent"
version = "0.1.0"
description = ""
authors = ["raushan <dummy@gmail.com>"]
packages = [{ include = "coding_agent" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
python-dotenv = ">=1.2.3,<2.0.0"
openai = ">=3.17.0,<4.0.0"
chromadb = ">=1.5.9,<2.0.0"
rich = ">=15.0.0,<16.0.0"
pydantic = ">=2.13.5,<3.0.0"
pyyaml = "^6.0.3"
dotenv = "^0.9.9"
langchain = {version = "^1.4.3", python = ">=3.12,<4.0.0"}
langchain-openai = {version = "^1.6.7", python = ">=3.12,<4.0.0"}
langchain-anthropic = {version = "^1.7.5", python = ">=3.12,<4.0.0"}
langchain-huggingface = {version = "^1.2.2", python = ">=3.12,<4.0.0"}
langchain-google-genai = {version = "^4.4.0", python = ">=3.12,<4.0.0"}
tree-sitter = "0.21.3"
tree-sitter-languages = "1.10.2"
sentence-transformers = "^6.1.0"

[tool.poetry.scripts]
coding-agent = "coding_agent.main:run"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
